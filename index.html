<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSAL OMNI-KNOWLEDGE ENGINE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }

        header {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 {
            font-size: 1.1rem;
            letter-spacing: 1px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .mining-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            background: #090d16;
            padding: 10px 24px;
            border-bottom: 1px solid #1e293b;
        }

        .tab-btn {
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #fff;
        }

        main {
            padding: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* --- STUDY NOTES STYLING --- */
        .notes-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 24px;
        }

        .subject-selector {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 16px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .sub-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: transparent;
            border: none;
            color: #cbd5e1;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .sub-btn:hover, .sub-btn.active {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            font-weight: bold;
        }

        .textbook-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 24px;
            line-height: 1.7;
        }

        .textbook-card h2 {
            color: #38bdf8;
            margin-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 8px;
        }

        .textbook-card h3 {
            color: #f43f5e;
            margin: 16px 0 8px 0;
            font-size: 1rem;
        }

        .textbook-card p, .textbook-card ul {
            color: #cbd5e1;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .diagram-box {
            background: #020617;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 16px;
            margin: 16px 0;
            text-align: center;
        }

        /* --- QUIZ STYLING --- */
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 28px;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .q-tag {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .q-title {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #fff;
        }

        .visual-diagram {
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 14px 18px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .opt-btn:hover:not([disabled]) {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.2) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
        }

        .opt-btn.wrong {
            background: rgba(244, 63, 94, 0.2) !important;
            border-color: #f43f5e !important;
            color: #fda4af !important;
        }

        .explanation-card {
            background: #020617;
            border-left: 4px solid #0284c7;
            padding: 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 20px;
            display: none;
        }

        .action-bar {
            display: flex;
            justify-content: flex-end;
        }

        .btn-next {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-next:hover { opacity: 0.9; }
    </style>
</head>

    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('notes')">📚 LESSON & TEXTBOOK NOTES</button>

    </div>

        <section id="notes-view" class="view-section active">
            <div class="notes-grid">
