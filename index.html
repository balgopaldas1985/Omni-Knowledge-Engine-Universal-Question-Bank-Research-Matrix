<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMNI-KNOWLEDGE ENGINE</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #020617;
            color: #f8fafc;
            padding-bottom: 40px;
        }

        header {
            background: #0f172a;
            border-bottom: 1px solid #1e293b;
            padding: 14px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: #38bdf8;
            text-transform: uppercase;
        }

        .mining-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid #10b981;
            color: #34d399;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.75rem;
        }

        .nav-tabs {
            display: flex;
            gap: 8px;
            background: #090d16;
            padding: 10px 16px;
            border-bottom: 1px solid #1e293b;
        }

        .tab-btn {
            flex: 1;
            background: #1e293b;
            border: none;
            color: #94a3b8;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.75rem;
            text-align: center;
        }

        .tab-btn.active {
            background: #0284c7;
            color: #fff;
        }

        main {
            padding: 16px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        /* --- STUDY NOTES STYLING --- */
        .subject-select-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            white-space: nowrap;
        }

        .sub-chip {
            background: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .sub-chip.active {
            background: #38bdf8;
            color: #0f172a;
            font-weight: bold;
            border-color: #38bdf8;
        }

        .textbook-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 18px;
            line-height: 1.6;
        }

        .textbook-card h2 {
            color: #38bdf8;
            font-size: 1.05rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 6px;
        }

        .textbook-card h3 {
            color: #f43f5e;
            margin: 14px 0 6px 0;
            font-size: 0.9rem;
        }

        .textbook-card p, .textbook-card ul {
            color: #cbd5e1;
            font-size: 0.85rem;
            margin-bottom: 10px;
        }

        .textbook-card ul {
            padding-left: 18px;
        }

        /* --- QUIZ STYLING --- */
        .quiz-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 18px;
        }

        .q-meta {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.75rem;
            color: #94a3b8;
        }

        .q-tag {
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .q-title {
            font-size: 0.95rem;
            margin-bottom: 16px;
            color: #fff;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
        }

        .opt-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 12px 14px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .opt-btn.correct {
            background: rgba(16, 185, 129, 0.25) !important;
            border-color: #10b981 !important;
            color: #34d399 !important;
        }

        .opt-btn.wrong {
            background: rgba(244, 63, 94, 0.25) !important;
            border-color: #f43f5e !important;
            color: #fda4af !important;
        }

        .explanation-card {
            background: #020617;
            border-left: 3px solid #0284c7;
            padding: 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #cbd5e1;
            margin-bottom: 16px;
            display: none;
            line-height: 1.5;
        }

        .btn-next {
            width: 100%;
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

        <h1>OMNI-KNOWLEDGE</h1>
        <div class="mining-badge">KP: <span id="kpScore">0</span></div>
    </header>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('notes')">📚 LESSON NOTES</button>

    </div>

    <main>

        <!-- QUIZ VIEW -->
        <section id="quiz-view" class="view-section">

                <div class="q-meta">
                    <span class="q-tag" id="qSubject">PHYSICS</span>
                    <span id="qLevel">LEVEL: ADVANCED</span>

                <div class="q-title" id="qText">Loading question...</div>
                <div class="options-list" id="optContainer"></div>
                <div class="explanation-card" id="expBox"></div>
                <button class="btn-next" onclick="generateDynamicQuestion()">NEXT QUESTION ➔</button>
            </div>
        </section>
    </main>

        function loadNotesMenu() {
            const chipList = document.getElementById('subChipList');
            chipList.innerHTML = '';
            
            const keys = Object.keys(studyDatabase);
            keys.forEach((key, idx) => {
                const chip = document.createElement('button');
                chip.className = `sub-chip ${idx === 0 ? 'active' : ''}`;
                chip.innerText = studyDatabase[key].title;
                chip.onclick = () => {
                    document.querySelectorAll('.sub-chip').forEach(c => c.classList.remove('active'));

                    document.getElementById('noteContent').innerHTML = studyDatabase[key].content;

                chipList.appendChild(chip);
            });

            document.getElementById('noteContent').innerHTML = studyDatabase[keys[0]].content;
        }

            }

            container.innerHTML = '';

                btn.onclick = () => handleAnswer(btn, optObj.isCorrect, item.exp, optionsWithFlag);
                container.appendChild(btn);
            });
        }
